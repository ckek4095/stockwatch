[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockwatch-us-bot"
version = "0.2.0"
description = "A small Russian-language Telegram watchlist for US shares via Finnhub"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stockwatch = "stockwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["stockwatch*"]
